<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNO lobby (table)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main class="tv">
<header class="tv-head"><span class="wordmark">UNO</span><a class="btn btn-quiet" href="../../../platform/table/index.html">Change game</a></header>
<div class="lobby">
<section class="panel"><div class="panel-head"><h2>Players</h2><span class="seats-left">1 of 8 seats taken</span></div><ul class="roster"><li><span class="avatar p1" aria-hidden="true">E</span><span>Erin</span></li><li class="open"><span class="avatar" aria-hidden="true"></span><span>Free seat</span></li><li class="open"><span class="avatar" aria-hidden="true"></span><span>Free seat</span></li><li class="open"><span class="avatar" aria-hidden="true"></span><span>Free seat</span></li><li class="open"><span class="avatar" aria-hidden="true"></span><span>Free seat</span></li><li class="open"><span class="avatar" aria-hidden="true"></span><span>Free seat</span></li><li class="open"><span class="avatar" aria-hidden="true"></span><span>Free seat</span></li><li class="open"><span class="avatar" aria-hidden="true"></span><span>Free seat</span></li></ul><a class="wait" href="lobby.html">Waiting for players to join</a></section>
<section class="panel"><div class="panel-head"><h2>House rules</h2></div><div class="rules"><label class="rule" for="stack2"><span><b>Stacking +2s</b><small>Answer a +2 with a +2 and pass the total on.</small></span><input class="switch" type="checkbox" id="stack2"></label><label class="rule" for="stack4"><span><b>Stacking +4s</b><small>Answer a +4 with a +4 and pass the total on.</small></span><input class="switch" type="checkbox" id="stack4"></label><label class="rule" for="seven0"><span><b>7-0</b><small>A 7 swaps hands with a player you pick. A 0 passes every hand along.</small></span><input class="switch" type="checkbox" id="seven0"></label><label class="rule" for="jumpin"><span><b>Jump-in</b><small>Anyone can play an identical card out of turn. Play carries on from them.</small></span><input class="switch" type="checkbox" id="jumpin"></label></div></section>
</div>
<div class="start-row"><p>Start needs at least 2 players.</p><button class="btn btn-big" type="button" disabled>Start game</button></div>
</main>
</body>
</html>
